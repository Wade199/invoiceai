[project]
name = "assistant-ia-devis-factures"
version = "0.1.0"
description = "InvoiceAI - AI-powered extraction of data from invoices and quotes"
requires-python = ">=3.11"
readme = "README.md"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: several modules wired together, external APIs mocked",
    "slow: hits the real Gemini API (uses free-tier quota)",
]
